aid: levelten-energy
name: LevelTen Energy
description: LevelTen Energy operates a two-sided digital marketplace and transaction platform for
  carbon-free energy, describing itself as the transaction infrastructure for the energy transition.
  Clean energy buyers, advisors, project developers, utilities and financiers use the LevelTen Energy
  Marketplace to compare thousands of power purchase agreement (PPA) offers, run NPV and settlement
  cashflow analysis, evaluate risk scenarios and track a Development Maturity Score across projects in
  North America and Europe. The platform also covers granular certificates, hybrid and storage PPAs,
  and performance monitoring, alongside market intelligence products including MarketPulse, the LevelTen
  PPA Price Index and Market Transparency Reports. The marketplace is served by an authenticated API at
  api.levelten.energy, which is gated behind marketplace login and publishes no public developer
  documentation, SDKs or machine-readable specification at this time.
